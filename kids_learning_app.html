<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>সোনামণির পাঠশালা - 3D Premium Kids Learning App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Hind Siliguri', 'Fredoka', sans-serif;
            background: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #ede9fe 45%, #fef3c7 100%);
            overflow-x: hidden;
            color: #1e1b4b;
        }
        .font-eng { font-family: 'Fredoka', sans-serif; }

        .premium-card {
            position: relative;
            border-radius: 2rem;
            background: rgba(255,255,255,0.92);
            border: 4px solid #ffffff;
            box-shadow: 0 12px 0 rgba(30,27,75,0.14), 0 20px 30px rgba(30,27,75,0.10), inset 0 2px 6px rgba(255,255,255,0.9);
            transition: all 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }
        .premium-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 0 rgba(30,27,75,0.16), 0 26px 38px rgba(30,27,75,0.15), inset 0 2px 8px rgba(255,255,255,1); }
        .premium-card:active { transform: translateY(6px) scale(0.97); box-shadow: 0 4px 0 rgba(30,27,75,0.14), 0 8px 14px rgba(30,27,75,0.08); }

        .diorama-stage {
            background: radial-gradient(circle at 50% 25%, #ffffff 0%, #e0f2fe 70%, #bae6fd 100%);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 4px 12px rgba(15,23,42,0.08);
            border: 3px solid rgba(255,255,255,0.95);
        }
        .diorama-stage::before {
            content: '';
            position: absolute; bottom: -8%; left: -10%; right: -10%; height: 36%;
            background: linear-gradient(180deg, #86efac 0%, #22c55e 100%);
            border-radius: 50% 50% 0 0; box-shadow: inset 0 3px 6px rgba(255,255,255,0.5); pointer-events: none;
        }
        .toy-btn { transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 6px 0 rgba(15,23,42,0.2), 0 8px 15px rgba(15,23,42,0.1); }
        .toy-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(15,23,42,0.2); }

        @keyframes rigFloat { 0%,100%{transform:translateY(0px) rotate(0deg) scale(1)} 50%{transform:translateY(-9px) rotate(2.5deg) scale(1.04)} }
        @keyframes rigHop { 0%,100%{transform:translateY(0) scale(1,1)} 35%{transform:translateY(-14px) scale(0.94,1.07) rotate(-3deg)} 65%{transform:translateY(0) scale(1.06,0.94)} }
        @keyframes rigSlither { 0%,100%{transform:translateX(-5px) scale(1.03) rotate(-3deg)} 50%{transform:translateX(6px) scale(0.98) rotate(3deg)} }
        @keyframes rigFlap { 0%,100%{transform:translateY(0px) rotate(-4deg) scale(1)} 50%{transform:translateY(-12px) rotate(5deg) scale(1.06)} }
        @keyframes rigSwim { 0%,100%{transform:translateX(-7px) translateY(0px) rotate(-4deg)} 50%{transform:translateX(7px) translateY(-5px) rotate(4deg)} }
        @keyframes speakingWave { 0%,100%{transform:scaleY(0.35)} 50%{transform:scaleY(1.3)} }
        @keyframes popBurst { 0%{transform:scale(0.5);opacity:0} 50%{transform:scale(1.2);opacity:1} 100%{transform:scale(1) translateY(-25px);opacity:0} }
        @keyframes balloonRise { 0%{transform:translateY(105vh) scale(0.75); opacity:1} 100%{transform:translateY(-20vh) scale(1.15); opacity:0} }

        .rig-float { animation: rigFloat 2.6s ease-in-out infinite; }
        .rig-hop { animation: rigHop 1.9s ease-in-out infinite; }
        .rig-slither { animation: rigSlither 2.1s ease-in-out infinite; }
        .rig-flap { animation: rigFlap 1.7s ease-in-out infinite; }
        .rig-swim { animation: rigSwim 2.3s ease-in-out infinite; }
        .animate-burst { animation: popBurst 0.85s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-28 relative">
    <div id="celebration-layer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-xl border-b-4 border-indigo-200 px-3 py-2.5 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div onclick="triggerCelebration()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-500 to-pink-500 p-0.5 shadow-lg cursor-pointer active:scale-90 transition">
                    <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
                        <svg viewBox="0 0 64 64" class="w-10 h-10">
                            <defs>
                                <radialGradient id="mascotG" cx="35%" cy="30%" r="70%">
                                    <stop offset="0%" stop-color="#fde047"/>
                                    <stop offset="60%" stop-color="#f59e0b"/>
                                    <stop offset="100%" stop-color="#b45309"/>
                                </radialGradient>
                            </defs>
                            <circle cx="32" cy="34" r="22" fill="url(#mascotG)"/>
                            <circle cx="16" cy="18" r="9" fill="url(#mascotG)"/>
                            <circle cx="48" cy="18" r="9" fill="url(#mascotG)"/>
                            <circle cx="24" cy="31" r="4" fill="#1e1b4b"/>
                            <circle cx="40" cy="31" r="4" fill="#1e1b4b"/>
                            <circle cx="23" cy="29.5" r="1.5" fill="#fff"/>
                            <circle cx="39" cy="29.5" r="1.5" fill="#fff"/>
                            <ellipse cx="32" cy="37" rx="5" ry="3.5" fill="#78350f"/>
                            <path d="M25 43 Q32 49 39 43" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg sm:text-2xl font-extrabold bg-gradient-to-r from-indigo-700 via-purple-600 to-rose-600 bg-clip-text text-transparent">সোনামণির পাঠশালা</h1>
                        <span class="hidden sm:inline-block text-[11px] font-extrabold uppercase tracking-wider bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full border border-indigo-300">3D Edition</span>
                    </div>
                    <p class="text-xs text-slate-500 font-bold">খেলতে খেলতে বাংলা, English ও সংখ্যা শিখি</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="testPureBanglaVoice()" class="toy-btn flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white border-2 border-emerald-700 text-xs sm:text-sm font-bold" title="শুদ্ধ বাংলা কণ্ঠ পরীক্ষা করুন">
                    <span>🔊</span>
                    <span class="hidden md:inline">শুদ্ধ বাংলা কণ্ঠ</span>
                </button>

                <button id="parent-mode-btn" onclick="toggleParentMode()" class="toy-btn flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 text-xs sm:text-sm font-bold text-slate-700">
                    <span>🎙️</span>
                    <span class="hidden sm:inline">মা-বাবার কণ্ঠ</span>
                </button>

                <button onclick="triggerCelebration()" class="toy-btn flex items-center gap-1.5 bg-gradient-to-r from-amber-300 to-yellow-400 border-2 border-amber-500 px-3.5 py-1.5 rounded-2xl">
                    <svg viewBox="0 0 36 36" class="w-6 h-6">
                        <polygon points="18,2 23,13 35,14 26,22 29,34 18,28 7,34 10,22 1,14 13,13" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
                    </svg>
                    <span id="star-count" class="font-eng text-lg sm:text-xl font-extrabold text-amber-950">0</span>
                </button>
            </div>
        </div>

        <div id="parent-banner" class="hidden max-w-6xl mx-auto mt-2 bg-rose-50 border-2 border-rose-300 rounded-2xl p-2.5 text-xs sm:text-sm text-rose-900 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="font-bold">🎙️ মা-বাবার ভয়েস রেকর্ড মোড চালু:</span>
                <span>যেকোনো কার্ডে <b>"রেকর্ড"</b> বাটনে চাপ দিয়ে আপনার নিজের গলায় উচ্চারণ সেভ করুন।</span>
            </div>
            <button onclick="clearAllCustomVoices()" class="px-3 py-1 rounded-xl bg-white border border-rose-300 text-rose-700 font-bold hover:bg-rose-100">সব রেকর্ড মুছুন</button>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 pt-4 relative z-10">
        <div id="sub-controls" class="mb-5"></div>
        <div id="content-area" class="transition-all duration-300"></div>
    </main>

    <div id="card-modal" onclick="closeModal(event)" class="fixed inset-0 bg-indigo-950/70 backdrop-blur-md z-40 hidden items-center justify-center p-3 sm:p-5">
        <div onclick="event.stopPropagation()" id="modal-box" class="bg-gradient-to-b from-indigo-50 via-white to-emerald-50 border-8 border-white rounded-[2.6rem] max-w-xl w-full p-4 sm:p-6 text-center shadow-2xl relative overflow-hidden">
            <button onclick="closeModal()" class="toy-btn absolute top-3 right-3 w-11 h-11 rounded-full bg-rose-500 text-white text-xl font-extrabold border-4 border-white flex items-center justify-center z-30">✕</button>

            <div id="modal-stage-container" class="diorama-stage rounded-[2rem] border-4 border-indigo-100 p-2 my-1 relative select-none overflow-hidden">
                <div id="modal-game-prompt" class="inline-flex items-center gap-1.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white text-xs sm:text-sm font-extrabold px-4 py-1.5 rounded-full shadow-md mb-1 z-20 relative border-2 border-white">👆 ৩ডি চরিত্রটিতে ট্যাপ করো অথবা আঙুল দিয়ে ঘুরাও!</div>
                <div id="modal-visual" class="w-full h-60 sm:h-72 mx-auto flex items-center justify-center relative z-10 cursor-grab active:cursor-grabbing rounded-2xl overflow-hidden"></div>
                <div id="modal-action-feedback" class="h-6 mt-1 text-xs sm:text-sm font-extrabold text-emerald-800 relative z-20"></div>
            </div>

            <div id="modal-voice-wave" class="flex items-center justify-center gap-1.5 h-6 my-1 opacity-0 transition-opacity">
                <span class="w-1.5 h-4 bg-rose-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.1s"></span>
                <span class="w-1.5 h-6 bg-amber-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.2s"></span>
                <span class="w-1.5 h-5 bg-emerald-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.3s"></span>
                <span class="w-1.5 h-6 bg-indigo-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.15s"></span>
                <span class="text-xs font-extrabold text-indigo-700 ml-1">স্পষ্ট বাংলায় উচ্চারণ চলছে...</span>
            </div>

            <div class="flex items-center justify-center gap-3 mt-1">
                <span id="modal-badge" class="bg-indigo-600 text-white px-4 py-1 rounded-2xl text-3xl sm:text-4xl font-extrabold shadow-md border-2 border-indigo-200">অ</span>
                <div class="text-left">
                    <div id="modal-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-tight">অজগর</div>
                    <div id="modal-subtitle" class="text-sm sm:text-base font-bold text-rose-600">স্বরে অ</div>
                </div>
            </div>

            <div id="modal-extra" class="text-lg sm:text-xl text-indigo-950 mt-3 font-extrabold bg-amber-100/90 border-2 border-amber-300 rounded-2xl py-2.5 px-4 shadow-sm"></div>

            <div class="mt-4 flex flex-wrap justify-center gap-3">
                <button id="modal-replay-btn" class="toy-btn flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-base sm:text-lg font-extrabold border-2 border-emerald-700"><span>🔊</span> আবার শোনো</button>
                <button id="modal-action-btn" class="toy-btn flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-white text-base sm:text-lg font-extrabold border-2 border-orange-600"><span>✨</span> ৩ডি অ্যাকশন!</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-xl border-t-4 border-indigo-200 px-2 py-2 shadow-[0_-10px_25px_rgba(30,27,75,0.08)]">
        <div class="max-w-5xl mx-auto grid grid-cols-6 gap-1.5 sm:gap-3">
            <button onclick="switchTab('bangla')" id="tab-bangla" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-rose-500 text-white border-2 border-rose-700 scale-105"><span class="text-xl sm:text-2xl font-extrabold leading-none">অ আ</span><span class="text-[11px] sm:text-xs font-bold mt-1 truncate">বর্ণমালা</span></button>
            <button onclick="switchTab('english')" id="tab-english" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-sky-100 text-sky-900 border-2 border-sky-300"><span class="font-eng text-xl sm:text-2xl font-extrabold leading-none">ABC</span><span class="text-[11px] sm:text-xs font-bold mt-1 truncate">English</span></button>
            <button onclick="switchTab('numbers')" id="tab-numbers" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-emerald-100 text-emerald-900 border-2 border-emerald-300"><span class="text-xl sm:text-2xl font-extrabold leading-none">১২৩</span><span class="text-[11px] sm:text-xs font-bold mt-1 truncate">সংখ্যা</span></button>
            <button onclick="switchTab('sentences')" id="tab-sentences" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-purple-100 text-purple-900 border-2 border-purple-300"><span class="text-xl sm:text-2xl font-extrabold leading-none">কথা</span><span class="text-[11px] sm:text-xs font-bold mt-1 truncate">ছোট বাক্য</span></button>
            <button onclick="switchTab('rhymes')" id="tab-rhymes" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-amber-100 text-amber-900 border-2 border-amber-300"><span class="text-xl sm:text-2xl font-extrabold leading-none">ছড়া</span><span class="text-[11px] sm:text-xs font-bold mt-1 truncate">ছড়া ও গান</span></button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-pink-100 text-pink-900 border-2 border-pink-300"><span class="text-xl sm:text-2xl font-extrabold leading-none">কুইজ</span><span class="text-[11px] sm:text-xs font-bold mt-1 truncate">মজার খেলা</span></button>
        </div>
    </nav>

    <script>
        function renderUnified3DCardStage(archetype, primaryHex, secondaryHex, badgeText = '', count = 1) {
            const uid = 'g_' + Math.random().toString(36).substring(2, 8);
            const animClass = archetype === 'python' ? 'rig-slither' : (archetype === 'bird' || archetype === 'butterfly') ? 'rig-flap' : (archetype === 'fish' || archetype === 'boat') ? 'rig-swim' : (archetype === 'quadruped' || archetype === 'mouse' || archetype === 'child') ? 'rig-hop' : 'rig-float';
            function getCharacterSVG(scale = 1, offsetX = 0, offsetY = 0) {
                return `<g transform="translate(${offsetX}, ${offsetY}) scale(${scale})">${buildArchetypePaths(archetype, uid, primaryHex, secondaryHex)}</g>`;
            }
            let stageActors = '';
            if (count > 1 && count <= 10) {
                const cols = count <= 2 ? count : (count <= 4 ? 2 : (count <= 6 ? 3 : 5));
                const rows = Math.ceil(count / cols);
                const cellW = 160 / cols;
                const cellH = 95 / rows;
                const sc = count <= 2 ? 0.58 : (count <= 4 ? 0.44 : (count <= 6 ? 0.36 : 0.28));
                for (let i = 0; i < count; i++) {
                    const r = Math.floor(i / cols);
                    const c = i % cols;
                    const cx = (c + 0.5) * cellW + 20 - 100 * sc;
                    const cy = (r + 0.5) * cellH + 12 - 70 * sc;
                    stageActors += getCharacterSVG(sc, cx, cy);
                }
            } else {
                stageActors = getCharacterSVG(1, 0, 0);
            }

            return `
                <svg viewBox="0 0 200 135" class="w-full h-32 sm:h-36 overflow-visible drop-shadow-md ${animClass}">
                    <defs>
                        <radialGradient id="${uid}_main" cx="35%" cy="28%" r="70%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                            <stop offset="30%" stop-color="${primaryHex}"/>
                            <stop offset="100%" stop-color="${secondaryHex}"/>
                        </radialGradient>
                        <radialGradient id="${uid}_acc" cx="35%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#fef08a"/>
                            <stop offset="100%" stop-color="#f59e0b"/>
                        </radialGradient>
                        <linearGradient id="${uid}_leaf" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#4ade80"/>
                            <stop offset="100%" stop-color="#15803d"/>
                        </linearGradient>
                    </defs>
                    <ellipse cx="100" cy="120" rx="58" ry="10" fill="#0f172a" opacity="0.14"/>
                    ${stageActors}
                </svg>
            `;
        }

        function buildArchetypePaths(archetype, uid, primaryHex, secondaryHex) {
            switch (archetype) {
                case 'python':
                    return `
                        <path d="M28 102 C 52 54, 82 122, 112 72 C 135 38, 152 98, 168 62" fill="none" stroke="url(#${uid}_acc)" stroke-width="24" stroke-linecap="round"/>
                        <path d="M28 102 C 52 54, 82 122, 112 72 C 135 38, 152 98, 168 62" fill="none" stroke="url(#${uid}_main)" stroke-width="18" stroke-linecap="round"/>
                        <circle cx="58" cy="84" r="4.5" fill="#14532d" opacity="0.6"/>
                        <circle cx="96" cy="90" r="5" fill="#14532d" opacity="0.6"/>
                        <circle cx="132" cy="68" r="4.5" fill="#14532d" opacity="0.6"/>
                        <g transform="translate(148, 30)">
                            <ellipse cx="22" cy="26" rx="24" ry="18" fill="url(#${uid}_main)"/>
                            <circle cx="16" cy="17" r="7" fill="#fff"/><circle cx="31" cy="17" r="7" fill="#fff"/>
                            <circle cx="18" cy="17" r="3.8" fill="#0f172a"/><circle cx="33" cy="17" r="3.8" fill="#0f172a"/>
                            <circle cx="16.5" cy="15" r="1.5" fill="#fff"/><circle cx="31.5" cy="15" r="1.5" fill="#fff"/>
                            <path d="M12 32 Q24 43 38 32" fill="#dc2626"/>
                            <path d="M39 31 Q54 31 60 25 M54 30 L60 36" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>`;
                case 'fruit':
                    return `
                        <path d="M100 22 L100 38" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
                        <path d="M102 28 Q130 14 138 34 Q118 44 102 28 Z" fill="url(#${uid}_leaf)"/>
                        <path d="M100 34 C 134 34, 144 72, 124 104 C 110 124, 84 124, 72 104 C 54 74, 66 34, 100 34 Z" fill="url(#${uid}_main)"/>
                        <ellipse cx="82" cy="58" rx="7" ry="13" fill="#fff" opacity="0.42" transform="rotate(-20 82 58)"/>
                        <circle cx="88" cy="76" r="5" fill="#1e1b4b"/><circle cx="112" cy="76" r="5" fill="#1e1b4b"/>
                        <circle cx="86.5" cy="74" r="1.8" fill="#fff"/><circle cx="110.5" cy="74" r="1.8" fill="#fff"/>
                        <path d="M92 88 Q100 96 108 88" stroke="#7f1d1d" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
                case 'mouse':
                    return `
                        <path d="M134 96 Q160 78 148 56" stroke="#f472b6" stroke-width="5" fill="none" stroke-linecap="round"/>
                        <circle cx="76" cy="44" r="18" fill="url(#${uid}_main)"/><circle cx="76" cy="44" r="10" fill="#fbcfe8"/>
                        <circle cx="122" cy="44" r="18" fill="url(#${uid}_main)"/><circle cx="122" cy="44" r="10" fill="#fbcfe8"/>
                        <ellipse cx="99" cy="78" rx="34" ry="27" fill="url(#${uid}_main)"/>
                        <ellipse cx="99" cy="86" rx="20" ry="14" fill="#f1f5f9"/>
                        <circle cx="86" cy="69" r="6" fill="#fff"/><circle cx="112" cy="69" r="6" fill="#fff"/>
                        <circle cx="86" cy="69" r="3.5" fill="#0f172a"/><circle cx="112" cy="69" r="3.5" fill="#0f172a"/>
                        <circle cx="99" cy="79" r="5.5" fill="#ec4899"/>`;
                case 'bird':
                    return `
                        <path d="M32 56 Q65 18 100 58 Q135 18 168 56 Q140 86 100 74 Q60 86 32 56 Z" fill="url(#${uid}_main)"/>
                        <ellipse cx="100" cy="74" rx="24" ry="26" fill="url(#${uid}_main)"/>
                        <circle cx="100" cy="48" r="20" fill="#ffffff"/>
                        <circle cx="92" cy="45" r="4.5" fill="#0f172a"/><circle cx="108" cy="45" r="4.5" fill="#0f172a"/>
                        <path d="M92 52 Q100 68 108 52 Z" fill="url(#${uid}_acc)"/>`;
                case 'butterfly':
                    return `

        function add3DPixarEyesAndSmile(parentMesh, zOffset = 0.65, yOffset = 0.18, scale = 1) {
            const eyeWhiteGeo = new THREE.SphereGeometry(0.14 * scale, 16, 16);

            const pupilGeo = new THREE.SphereGeometry(0.075 * scale, 12, 12);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

            leftEye.position.set(-0.24 * scale, yOffset, zOffset);
            const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
            leftPupil.position.set(-0.24 * scale, yOffset, zOffset + 0.1 * scale);
            const rightEye = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
            rightEye.position.set(0.24 * scale, yOffset, zOffset);
            const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
            rightPupil.position.set(0.24 * scale, yOffset, zOffset + 0.1 * scale);
            const cheekGeo = new THREE.SphereGeometry(0.09 * scale, 12, 12);
            const cheekMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
            const cheekL = new THREE.Mesh(cheekGeo, cheekMat); cheekL.position.set(-0.38 * scale, yOffset - 0.14 * scale, zOffset - 0.04);
            const cheekR = new THREE.Mesh(cheekGeo, cheekMat); cheekR.position.set(0.38 * scale, yOffset - 0.14 * scale, zOffset - 0.04);
            const mouthGeo = new THREE.TorusGeometry(0.12 * scale, 0.035 * scale, 10, 20, Math.PI);
            const mouthMat = new THREE.MeshBasicMaterial({ color: 0x881337 });
            const mouth = new THREE.Mesh(mouthGeo, mouthMat); mouth.rotation.x = Math.PI; mouth.position.set(0, yOffset - 0.16 * scale, zOffset + 0.04);
            parentMesh.add(leftEye, leftPupil, rightEye, rightPupil, cheekL, cheekR, mouth);
        }

        function buildUniversal3DActor(group, archetype, primaryHex, secondaryHex, count = 1) {
            stage3D.snakeSegments = [];
            stage3D.wings = [];
            stage3D.wheels = [];
            const mainColor = new THREE.Color(primaryHex || '#f43f5e');
            const secColor = new THREE.Color(secondaryHex || '#fbbf24');
            const mainMat = new THREE.MeshPhongMaterial({ color: mainColor, shininess: 95, specular: 0xffffff });
            const secMat = new THREE.MeshPhongMaterial({ color: secColor, shininess: 85 });
            const darkMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, shininess: 60 });
            const whiteMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 100 });

            function createSingle3DModel() {
                const model = new THREE.Group();

                if (archetype === 'python') {
                    const segCount = 20;
                    for (let i = 0; i < segCount; i++) {
                        const r = i === 0 ? 0.56 : Math.max(0.15, 0.46 * (1 - i / (segCount + 2)));
                        const seg = new THREE.Group();
                        const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), i % 2 === 0 ? mainMat : secMat);
                        seg.add(sphere);
                        if (i === 0) {
                            sphere.scale.set(1.2, 1.0, 1.35);
                            sphere.userData.isHead = true;
                            add3DPixarEyesAndSmile(seg, 0.52, 0.22, 1.12);
                            const tongue = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.03, 0.55), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
                            tongue.position.set(0, -0.1, 0.8); seg.add(tongue);
                        }
                        model.add(seg);
                        stage3D.snakeSegments.push(seg);
                    }
                    return model;
                }

                if (archetype === 'fruit') {
                    const body = new THREE.Mesh(new THREE.SphereGeometry(0.85, 28, 28), mainMat); body.scale.set(0.95, 1.18, 0.9);
                    model.add(body);
                    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.45, 12), new THREE.MeshPhongMaterial({ color: 0x78350f })); stem.position.set(0, 1.05, 0);
                    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), new THREE.MeshPhongMaterial({ color: 0x16a34a })); leaf.scale.set(1.6, 0.28, 0.7); leaf.position.set(0.35, 1.0, 0); leaf.rotation.z = 0.35;
                    model.add(stem, leaf);
                    add3DPixarEyesAndSmile(model, 0.74, 0.15, 1.05);
                    return model;
                }

                if (archetype === 'bird' || archetype === 'butterfly') {
                    const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 24), mainMat); body.scale.set(0.9, 1.05, 1.2);
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 24, 24), archetype === 'bird' ? whiteMat : secMat); head.position.set(0, 0.55, 0.35);
                    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.42, 16), secMat); beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.52, 0.88);
                    model.add(body, head, beak);
                    add3DPixarEyesAndSmile(head, 0.4, 0.08, 0.85);
                    const wingGeo = archetype === 'butterfly' ? new THREE.SphereGeometry(0.75, 20, 16) : new THREE.BoxGeometry(1.45, 0.12, 0.68);
                    const wingL = new THREE.Mesh(wingGeo, secMat); if (archetype === 'butterfly') wingL.scale.set(1.2, 0.15, 0.85); wingL.position.set(-0.95, 0.25, 0);
                    const wingR = new THREE.Mesh(wingGeo, secMat); if (archetype === 'butterfly') wingR.scale.set(1.2, 0.15, 0.85); wingR.position.set(0.95, 0.25, 0);
                    model.add(wingL, wingR); stage3D.wings.push({ wingL, wingR });
                    return model;
                }

                if (archetype === 'fish') {
                    const body = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 24), mainMat); body.scale.set(1.35, 0.92, 0.75);
                    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.65, 4), secMat); tail.rotation.z = Math.PI / 2; tail.position.set(-1.1, 0, 0);
                    model.add(body, tail); add3DPixarEyesAndSmile(model, 0.54, 0.12, 0.95); return model;
                }

                if (archetype === 'quadruped' || archetype === 'mouse') {
                    const torso = new THREE.Mesh(new THREE.SphereGeometry(0.72, 24, 24), mainMat); torso.scale.set(1.25, 0.92, 0.95); torso.position.set(0,-0.1,0);
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.56, 24, 24), mainMat); head.position.set(0, 0.48, 0.55);
                    const earGeo = new THREE.SphereGeometry(0.28, 16, 16); earGeo.scale(0.8, 1.35, 0.4);
                    const earL = new THREE.Mesh(earGeo, secMat); earL.position.set(-0.38, 0.95, 0.5);
                    const earR = new THREE.Mesh(earGeo, secMat); earR.position.set(0.38, 0.95, 0.5);
                    [[-0.42,-0.75,0.35],[0.42,-0.75,0.35],[-0.42,-0.75,-0.35],[0.42,-0.75,-0.35]].forEach(pos => {
                        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.55, 12), secMat); leg.position.set(...pos); model.add(leg);
                    });
                    model.add(torso, head, earL, earR); add3DPixarEyesAndSmile(head, 0.48, 0.08, 0.95); return model;
                }

                if (archetype === 'vehicle' || archetype === 'boat') {
                    const base = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.65, 1.1), mainMat); base.position.y = -0.15;
                    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.55, 0.95), secMat); cabin.position.set(0, 0.42, 0);
                    model.add(base, cabin); add3DPixarEyesAndSmile(base, 0.56, 0.05, 0.9);
                    if (archetype === 'vehicle') {
                        [[-0.6,-0.52,0.58],[0.6,-0.52,0.58],[-0.6,-0.52,-0.58],[0.6,-0.52,-0.58]].forEach(pos => {
                            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.2, 16), darkMat); wheel.rotation.x = Math.PI / 2; wheel.position.set(...pos); model.add(wheel); stage3D.wheels.push(wheel);
                        });
                    }
                    return model;
                }

                if (archetype === 'flower' || archetype === 'sun' || archetype === 'star' || archetype === 'moon') {
                    const core = new THREE.Mesh(new THREE.SphereGeometry(0.68, 24, 24), secMat); model.add(core);
                    for (let i = 0; i < 8; i++) {
                        const a = (i / 8) * Math.PI * 2;
                        const petal = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), mainMat); petal.position.set(Math.cos(a) * 0.82, Math.sin(a) * 0.82, -0.05); model.add(petal);
                    }
                    add3DPixarEyesAndSmile(core, 0.62, 0.1, 1.0); return model;
                }

                const body = new THREE.Mesh(new THREE.SphereGeometry(0.82, 28, 28), mainMat);
                const hat = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.65, 20), secMat); hat.position.set(0, 0.95, 0);
                model.add(body, hat); add3DPixarEyesAndSmile(body, 0.76, 0.12, 1.1); return model;
            }

            if (count > 1 && count <= 10) {
                const cols = count <= 3 ? count : Math.ceil(count / 2);
                const scale = count <= 2 ? 0.68 : (count <= 5 ? 0.52 : 0.38);
                for (let i = 0; i < count; i++) {
                    const inst = createSingle3DModel(); inst.scale.setScalar(scale);
                    const row = Math.floor(i / cols); const col = i % cols;
                    const xSpread = (col - (cols - 1) / 2) * (2.6 / Math.max(1, cols - 1 || 1));
                    const ySpread = (0.5 - row) * 1.1;
                    inst.position.set(cols === 1 ? 0 : xSpread, count <= 3 ? 0 : ySpread, row * 0.35);
                    inst.userData.phase = i * 0.7;
                    group.add(inst);
                }
            } else {
                const single = createSingle3DModel(); group.add(single);
            }
        }

        function trigger3DExplosion(originPos = new THREE.Vector3(0, 0.3, 0.4)) {
            if (!stage3D.scene) return;
            const colors = [0xf43f5e, 0xf59e0b, 0x10b981, 0x3b82f6, 0xa855f7, 0xfacc15];
            for (let i = 0; i < 24; i++) {
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.12 + Math.random() * 0.08, 12, 12),
                    new THREE.MeshPhongMaterial({ color: colors[i % colors.length], shininess: 100 })
                );
                mesh.position.copy(originPos);
                const angle = Math.random() * Math.PI * 2;
                const spd = 2.5 + Math.random() * 4.5;
                mesh.userData.vel = new THREE.Vector3(Math.cos(angle) * spd, 3.2 + Math.random() * 4, Math.sin(angle) * spd);
                mesh.userData.life = 1.0;
                stage3D.scene.add(mesh); stage3D.particles.push(mesh);
            }
        }

        function setupUnified3DModalStage({ archetype, primaryHex, secondaryHex, count = 1, promptText, feedbackText, speakFn }) {
            stop3DStage();
            const visualBox = document.getElementById('modal-visual');
            const promptEl = document.getElementById('modal-game-prompt');
            const feedbackEl = document.getElementById('modal-action-feedback');
            visualBox.innerHTML = ''; feedbackEl.textContent = ''; promptEl.innerHTML = promptText || '👆 ৩ডি খেলনায় ট্যাপ করে অ্যাকশন দেখো বা আঙুল দিয়ে ঘুরাও!';

            stage3D.archetype = archetype || 'child'; stage3D.currentSpeakFn = speakFn;
            const width = visualBox.clientWidth || 420; const height = visualBox.clientHeight || 260;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100); camera.position.set(0, 0.75, 5.2); camera.lookAt(0,0,0);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setSize(width, height); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); visualBox.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const keyLight = new THREE.DirectionalLight(0xfffbeb, 1.0); keyLight.position.set(4,8,6); scene.add(keyLight);
            const rimLight = new THREE.PointLight(0x38bdf8, 0.75, 15); rimLight.position.set(-4,3,-3); scene.add(rimLight);

            const island = new THREE.Mesh(new THREE.CylinderGeometry(3.1, 2.5, 0.45, 36), new THREE.MeshPhongMaterial({ color: 0x4ade80, shininess: 30 })); island.position.set(0,-1.55,0); scene.add(island);
            const actorGroup = new THREE.Group(); scene.add(actorGroup);

            stage3D.scene = scene; stage3D.camera = camera; stage3D.renderer = renderer; stage3D.actorGroup = actorGroup; stage3D.clock = new THREE.Clock(); stage3D.particles = []; stage3D.actionState = 'idle'; stage3D.actionTimer = 0; stage3D.userRotY = 0;

            buildUniversal3DActor(actorGroup, stage3D.archetype, primaryHex, secondaryHex, count);

            let startX = 0; let downTime = 0;
            const onDown = (x) => { stage3D.isDragging = true; stage3D.prevX = x; startX = x; downTime = Date.now(); };
            const onMove = (x) => { if (!stage3D.isDragging) return; stage3D.userRotY += (x - stage3D.prevX) * 0.014; stage3D.prevX = x; };
            const onUp = (x) => {
                if (!stage3D.isDragging) return;
                stage3D.isDragging = false;
                if (Math.abs(x - startX) < 24 || Date.now() - downTime < 300) {
                    triggerModal3DAction(feedbackText);
                }
            };

            renderer.domElement.addEventListener('mousedown', e => onDown(e.clientX));
            window.addEventListener('mousemove', e => onMove(e.clientX));
            window.addEventListener('mouseup', e => onUp(e.clientX));
            renderer.domElement.addEventListener('touchstart', e => { if (e.touches[0]) onDown(e.touches[0].clientX); }, { passive: true });
            renderer.domElement.addEventListener('touchmove', e => { if (e.touches[0]) onMove(e.touches[0].clientX); }, { passive: true });
            renderer.domElement.addEventListener('touchend', e => { const x = e.changedTouches[0] ? e.changedTouches[0].clientX : startX; onUp(x); });
            document.getElementById('modal-action-btn').onclick = () => triggerModal3DAction(feedbackText);

            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            function handlePointerEvent(clientX, clientY) {
                const rect = renderer.domElement.getBoundingClientRect();
                pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const intersects = raycaster.intersectObjects(actorGroup.children, true);
                if (intersects.length > 0) {
                    triggerModal3DAction(feedbackText);
                    return true;
                }
                return false;
            }
            renderer.domElement.addEventListener('click', (e) => { handlePointerEvent(e.clientX, e.clientY); });

            function animateLoop() {
                stage3D.animId = requestAnimationFrame(animateLoop);
                const dt = Math.min(stage3D.clock.getDelta(), 0.1); const t = stage3D.clock.getElapsedTime();

                for (let i = stage3D.particles.length - 1; i >= 0; i--) {
                    const p = stage3D.particles[i];
                    p.position.addScaledVector(p.userData.vel, dt);
                    p.userData.vel.y -= 9.5 * dt;
                    p.userData.life -= dt * 1.15;
                    p.scale.setScalar(Math.max(0.01, p.userData.life));
                    if (p.userData.life <= 0) { scene.remove(p); stage3D.particles.splice(i, 1); }
                }

                stage3D.wings.forEach(w => {
                    const flap = Math.sin(t * 11) * 0.55;
                    w.wingL.rotation.z = flap;
                    w.wingR.rotation.z = -flap;
                });

                stage3D.wheels.forEach(wh => { wh.rotation.z -= dt * 5; });

                if (stage3D.archetype === 'python' && stage3D.snakeSegments.length > 0) {
                    const head = stage3D.snakeSegments[0];
                    if (stage3D.actionState === 'idle') {
                        const chargeZ = ((t * 1.4) % 3.0) - 1.3;
                        stage3D.snakeSegments.forEach((seg, idx) => {
                            const lag = idx * 0.22;
                            seg.position.set(Math.sin(t * 5.5 - lag) * 0.48, Math.abs(Math.cos(t * 5.5 - lag)) * 0.18 - 0.65 + (idx === 0 ? 0.2 : 0), chargeZ - idx * 0.22);
                        });
                        actorGroup.rotation.y = stage3D.userRotY;
                        if (head) head.rotation.z = Math.sin(t * 8) * 0.18;
                    } else {
                        stage3D.actionTimer += dt;
                        actorGroup.position.y = Math.sin(stage3D.actionTimer * Math.PI) * 2.4;
                        actorGroup.rotation.y += dt * 14;
                        actorGroup.rotation.x += dt * 10;
                        if (head) head.rotation.z = Math.sin(stage3D.actionTimer * 30) * 0.28;
                        if (stage3D.actionTimer >= 0.9) { stage3D.actionState = 'idle'; actorGroup.position.set(0,0,0); actorGroup.rotation.set(0, stage3D.userRotY, 0); }
                    }
                } else {
                    if (stage3D.actionState === 'idle') {
                        actorGroup.position.y = Math.sin(t * 3.2) * 0.18;
                        actorGroup.rotation.y = Math.sin(t * 1.4) * 0.35 + stage3D.userRotY;
                        actorGroup.children.forEach((child, idx) => {
                            if (actorGroup.children.length > 1) { child.position.y += Math.sin(t * 4 + idx) * 0.003; child.rotation.y = Math.sin(t * 2 + idx) * 0.25; }
                        });
                    } else {
                        stage3D.actionTimer += dt; actorGroup.position.y = Math.sin(stage3D.actionTimer * Math.PI) * 1.9; actorGroup.rotation.y += dt * 12;
                        if (stage3D.actionTimer >= 0.85) { stage3D.actionState = 'idle'; actorGroup.position.y = 0; }
                    }
                }

                renderer.render(scene, camera);
            }
            animateLoop();
        }

        function triggerModal3DAction(customFeedback) {
            playAdventureBoingSound();
            trigger3DExplosion();
            stage3D.actionState = 'jump'; stage3D.actionTimer = 0;

            const feedback = document.getElementById('quiz-feedback');
            if (selectedItem.id === currentQuizAnswer.id) {
                cardEl.style.borderColor = '#22c55e'; feedback.innerHTML = '🎉 শাবাশ সোনামণি! সঠিক উত্তর! (+২ ⭐)'; triggerCelebration(); addStar(2); openUnifiedModal({ badge: '🏆', title: `${selectedItem.nameBn} (${selectedItem.nameEn})`, subtitle: 'সঠিক উত্তর! শাবাশ সোনামণি!', extra: `তুমি একদম ঠিক চিনেছো, এটি ${selectedItem.nameBn}!`, archetype: selectedItem.archetype, pHex: selectedItem.pHex, sHex: selectedItem.sHex, speakFn: () => speakText(`শাবাশ সোনামণি, সঠিক উত্তর, এটি ${selectedItem.nameBn}`, 'bn-BD') });
            } else {
                cardEl.classList.add('opacity-50'); playWrongSound(); feedback.innerHTML = '<span class="text-rose-600">আবার চেষ্টা করো সোনামণি! 😊</span>'; speakText('হয়নি সোনামণি, আবার চেষ্টা করো', 'bn-BD');
            }
        }

        window.onload = function () { document.getElementById('star-count').textContent = starScore; renderCurrentTab(); };
    </script>
</body>
