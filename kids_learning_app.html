<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>সোনামণির পাঠশালা - 3D Premium Kids Learning App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-1: #f5f7ff;
      --bg-2: #e0f2fe;
      --bg-3: #fef3c7;
      --glass: rgba(255,255,255,0.72);
      --ink: #1e1b4b;
      --indigo: #4f46e5;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --shadow: rgba(15, 23, 42, 0.16);
      --green-deep: #1d7a4d;
      --grass: #5dd07c;
      --grass-dark: #1ca35a;
    }

    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Hind Siliguri', 'Fredoka', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(191,219,254,1) 0%, rgba(224,242,254,0.9) 18%, rgba(237,233,254,0.9) 42%, rgba(254,243,199,0.85) 100%);
      overflow-x: hidden;
    }

    .font-eng { font-family: 'Fredoka', sans-serif; }

    .toy-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      box-shadow: 0 6px 0 rgba(15, 23, 42, 0.18), 0 10px 18px rgba(15, 23, 42, 0.12);
      border: 2px solid rgba(255,255,255,0.7);
    }
    .toy-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(15, 23, 42, 0.18); }

    .premium-card {
      position: relative;
      border-radius: 2rem;
      background: rgba(255,255,255,0.82);
      border: 4px solid rgba(255,255,255,0.9);
      box-shadow:
        0 12px 0 rgba(30,27,75,0.12),
        0 24px 34px rgba(30,27,75,0.12),
        inset 0 2px 8px rgba(255,255,255,1);
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
      cursor: pointer;
    }

    .premium-card:hover {
      transform: translateY(-7px) scale(1.015);
      box-shadow:
        0 18px 0 rgba(30,27,75,0.15),
        0 30px 42px rgba(30,27,75,0.14),
        inset 0 2px 10px rgba(255,255,255,1);
    }

    .diorama-stage {
      position: relative;
      overflow: hidden;
      border-radius: 1.5rem;
      background: linear-gradient(180deg, #f0f9ff 0%, #dbeafe 42%, #d4f9d0 100%);
      border: 3px solid rgba(255,255,255,0.95);
      box-shadow: inset 0 4px 12px rgba(15,23,42,0.08);
      isolation: isolate;
    }

    .diorama-stage::before {
      content: '';
      position: absolute;
      inset: auto -10% -28% -10%;
      height: 42%;
      background: linear-gradient(180deg, rgba(110,231,183,0.95) 0%, rgba(34,197,94,0.95) 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: inset 0 4px 10px rgba(255,255,255,0.5);
      z-index: 0;
    }

    .diorama-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 18%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 42%);
      z-index: 0;
      pointer-events: none;
    }

    .scene-svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 150px;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 18px 12px rgba(63, 83, 149, 0.16));
    }

    .snake-hero { animation: snakeFloat 2.8s ease-in-out infinite; }
    .bird-hero { animation: birdFloat 2.2s ease-in-out infinite; }
    .fish-hero { animation: fishSwim 2.6s ease-in-out infinite; }
    .rocket-hero { animation: rocketFloat 1.7s ease-in-out infinite; }
    .bounce-hero { animation: bounceHop 1.8s ease-in-out infinite; }

    @keyframes snakeFloat {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      30% { transform: translateY(-6px) rotate(-2deg) scale(1.03); }
      60% { transform: translateY(-10px) rotate(2deg) scale(1.05); }
    }

    @keyframes birdFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes fishSwim {
      0%, 100% { transform: translateX(-4px) translateY(0px) rotate(-3deg); }
      50% { transform: translateX(8px) translateY(-6px) rotate(4deg); }
    }

    @keyframes rocketFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    @keyframes bounceHop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      40% { transform: translateY(-14px) scale(0.96, 1.08); }
      70% { transform: translateY(0) scale(1.06, 0.95); }
    }

    @keyframes speakingWave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1.3); }
    }

    @keyframes popBurst {
      0% { transform: scale(0.4); opacity: 0; }
      35% { transform: scale(1.22); opacity: 1; }
      100% { transform: scale(1) translateY(-25px); opacity: 0; }
    }

    @keyframes balloonRise {
      0% { transform: translateY(105vh) scale(0.7); opacity: 1; }
      100% { transform: translateY(-18vh) scale(1.1); opacity: 0; }
    }

    .animate-burst { animation: popBurst 0.9s ease-out forwards; }
    .balloon-rise { animation: balloonRise 2.1s ease-in forwards; }

    .celebration-spark {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      box-shadow: 0 0 18px rgba(255,255,255,0.75);
      opacity: 0;
      animation: popBurst 0.9s ease-out forwards;
    }

    .nav-tab { min-height: 64px; }

    .glass-panel {
      background: rgba(255,255,255,0.72);
      border: 2px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-28 relative">
  <div id="celebration-layer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b-4 border-indigo-200 px-3 py-2.5 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div onclick="triggerCelebration()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-500 to-pink-500 p-0.5 shadow-lg cursor-pointer active:scale-90 transition">
          <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center">
            <svg viewBox="0 0 64 64" class="w-10 h-10">
              <defs>
                <radialGradient id="mascotG" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#fde68a" />
                  <stop offset="60%" stop-color="#f59e0b" />
                  <stop offset="100%" stop-color="#b45309" />
                </radialGradient>
              </defs>
              <circle cx="32" cy="34" r="22" fill="url(#mascotG)"/>
              <circle cx="16" cy="18" r="9" fill="url(#mascotG)"/>
              <circle cx="48" cy="18" r="9" fill="url(#mascotG)"/>
              <circle cx="24" cy="31" r="4" fill="#1e1b4b"/>
              <circle cx="40" cy="31" r="4" fill="#1e1b4b"/>
              <circle cx="23" cy="29.5" r="1.5" fill="#fff"/>
              <circle cx="39" cy="29.5" r="1.5" fill="#fff"/>
              <ellipse cx="32" cy="37" rx="5" ry="3.5" fill="#78350f"/>
              <path d="M25 43 Q32 49 39 43" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg sm:text-2xl font-extrabold bg-gradient-to-r from-indigo-700 via-purple-600 to-rose-600 bg-clip-text text-transparent">সোনামণির পাঠশালা</h1>
            <span class="hidden sm:inline-block text-[11px] font-extrabold uppercase tracking-wider bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full border border-indigo-300">3D Edition</span>
          </div>
          <p class="text-xs text-slate-500 font-bold">খেলতে খেলতে বাংলা, English ও সংখ্যা শিখি</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="testPureBanglaVoice()" class="toy-btn flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-bold">
          <span>🔊</span>
          <span class="hidden md:inline">শুদ্ধ বাংলা কণ্ঠ</span>
        </button>

        <button id="parent-mode-btn" onclick="toggleParentMode()" class="toy-btn flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-bold">
          <span>🎙️</span>
          <span class="hidden sm:inline">মা-বাবার কণ্ঠ</span>
        </button>

        <button onclick="triggerCelebration()" class="toy-btn flex items-center gap-1.5 bg-gradient-to-r from-amber-300 to-yellow-400 border-2 border-amber-500 px-3.5 py-1.5 rounded-2xl">
          <svg viewBox="0 0 36 36" class="w-6 h-6">
            <polygon points="18,2 23,13 35,14 26,22 29,34 18,28 7,34 10,22 1,14 13,13" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
          </svg>
          <span id="star-count" class="font-eng text-lg sm:text-xl font-extrabold text-amber-950">0</span>
        </button>
      </div>
    </div>

    <div id="parent-banner" class="hidden max-w-6xl mx-auto mt-2 bg-rose-50 border-2 border-rose-300 rounded-2xl p-2.5 text-xs sm:text-sm text-rose-900 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="font-bold">🎙️ মা-বাবার ভয়েস রেকর্ড মোড চালু:</span>
        <span>যেকোনো কার্ডে <b>"রেকর্ড"</b> বাটনে চাপ দিয়ে আপনার নিজের গলায় উচ্চারণ সেভ করুন।</span>
      </div>
      <button onclick="clearAllCustomVoices()" class="px-3 py-1 rounded-xl bg-white border border-rose-300 text-rose-700 font-bold hover:bg-rose-100">সব রেকর্ড মুছুন</button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 pt-4 relative z-10">
    <div id="sub-controls" class="mb-5"></div>
    <div id="content-area" class="transition-all duration-300"></div>
  </main>

  <div id="card-modal" onclick="closeModal(event)" class="fixed inset-0 bg-indigo-950/70 backdrop-blur-md z-40 hidden items-center justify-center p-3 sm:p-5">
    <div onclick="event.stopPropagation()" id="modal-box" class="bg-gradient-to-b from-indigo-50 via-white to-emerald-50 border-8 border-white rounded-[2.6rem] max-w-xl w-full p-4 sm:p-6 text-center shadow-2xl relative overflow-hidden">
      <button onclick="closeModal()" class="toy-btn absolute top-3 right-3 w-11 h-11 rounded-full bg-rose-500 text-white text-xl font-extrabold border-4 border-white flex items-center justify-center z-30">✕</button>

      <div id="modal-stage-container" class="diorama-stage rounded-[2rem] border-4 border-indigo-100 p-2 my-1 relative select-none overflow-hidden">
        <div id="modal-game-prompt" class="inline-flex items-center gap-1.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white text-xs sm:text-sm font-extrabold px-4 py-1.5 rounded-full shadow-md mb-1 z-20 relative border-2 border-white">👆 ৩ডি চরিত্রটিতে ট্যাপ করো অথবা আঙুল দিয়ে ঘুরাও!</div>
        <div id="modal-visual" class="w-full h-60 sm:h-72 mx-auto flex items-center justify-center relative z-10 cursor-grab active:cursor-grabbing rounded-2xl overflow-hidden"></div>
        <div id="modal-action-feedback" class="h-6 mt-1 text-xs sm:text-sm font-extrabold text-emerald-800 relative z-20"></div>
      </div>

      <div id="modal-voice-wave" class="flex items-center justify-center gap-1.5 h-6 my-1 opacity-0 transition-opacity">
        <span class="w-1.5 h-4 bg-rose-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.1s"></span>
        <span class="w-1.5 h-6 bg-amber-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.2s"></span>
        <span class="w-1.5 h-5 bg-emerald-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.3s"></span>
        <span class="w-1.5 h-6 bg-indigo-500 rounded-full" style="animation: speakingWave 0.5s infinite 0.15s"></span>
        <span class="text-xs font-extrabold text-indigo-700 ml-1">স্পষ্ট বাংলায় উচ্চারণ চলছে...</span>
      </div>

      <div class="flex items-center justify-center gap-3 mt-1">
        <span id="modal-badge" class="bg-indigo-600 text-white px-4 py-1 rounded-2xl text-3xl sm:text-4xl font-extrabold shadow-md border-2 border-indigo-200">অ</span>
        <div class="text-left">
          <div id="modal-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-tight">অজগর</div>
          <div id="modal-subtitle" class="text-sm sm:text-base font-bold text-rose-600">স্বরে অ</div>
        </div>
      </div>

      <div id="modal-extra" class="text-lg sm:text-xl text-indigo-950 mt-3 font-extrabold bg-amber-100/90 border-2 border-amber-300 rounded-2xl py-2.5 px-4 shadow-sm"></div>

      <div class="mt-4 flex flex-wrap justify-center gap-3">
        <button id="modal-replay-btn" class="toy-btn flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-base sm:text-lg font-extrabold border-2 border-emerald-700">
          <span>🔊</span> আবার শোনো
        </button>
        <button id="modal-action-btn" class="toy-btn flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-white text-base sm:text-lg font-extrabold border-2 border-orange-600">
          <span>✨</span> ৩ডি অ্যাকশন!
        </button>
      </div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-xl border-t-4 border-indigo-200 px-2 py-2 shadow-[0_-10px_25px_rgba(30,27,75,0.08)]">
    <div class="max-w-5xl mx-auto grid grid-cols-6 gap-1.5 sm:gap-3">
      <button onclick="switchTab('bangla')" id="tab-bangla" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-rose-500 text-white border-2 border-rose-700 scale-105">
        <span class="text-xl sm:text-2xl font-extrabold leading-none">অ আ</span>
        <span class="text-[11px] sm:text-xs font-bold mt-1 truncate">বর্ণমালা</span>
      </button>
      <button onclick="switchTab('english')" id="tab-english" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-sky-100 text-sky-900 border-2 border-sky-300">
        <span class="font-eng text-xl sm:text-2xl font-extrabold leading-none">ABC</span>
        <span class="text-[11px] sm:text-xs font-bold mt-1 truncate">English</span>
      </button>
      <button onclick="switchTab('numbers')" id="tab-numbers" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-emerald-100 text-emerald-900 border-2 border-emerald-300">
        <span class="text-xl sm:text-2xl font-extrabold leading-none">১২৩</span>
        <span class="text-[11px] sm:text-xs font-bold mt-1 truncate">সংখ্যা</span>
      </button>
      <button onclick="switchTab('sentences')" id="tab-sentences" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-purple-100 text-purple-900 border-2 border-purple-300">
        <span class="text-xl sm:text-2xl font-extrabold leading-none">কথা</span>
        <span class="text-[11px] sm:text-xs font-bold mt-1 truncate">ছোট বাক্য</span>
      </button>
      <button onclick="switchTab('rhymes')" id="tab-rhymes" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-amber-100 text-amber-900 border-2 border-amber-300">
        <span class="text-xl sm:text-2xl font-extrabold leading-none">ছড়া</span>
        <span class="text-[11px] sm:text-xs font-bold mt-1 truncate">ছড়া ও গান</span>
      </button>
      <button onclick="switchTab('quiz')" id="tab-quiz" class="nav-tab toy-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl bg-pink-100 text-pink-900 border-2 border-pink-300">
        <span class="text-xl sm:text-2xl font-extrabold leading-none">কুইজ</span>
        <span class="text-[11px] sm:text-xs font-bold mt-1 truncate">মজার খেলা</span>
      </button>
    </div>
  </nav>

  <script>
    const data = {
      bangla: [
        { title: 'অ', badge: 'অ', subtitle: 'স্বরে অ', word: 'অজগর', extra: 'অজগর আসছে তেড়ে! অ-র লম্বা ভেজা ডংগা-ধরনের ভিজ্যুয়াল দেখো।', archetype: 'snake', accent: '#4f46e5', tone: '#10b981', sound: 'অ' },

        { title: '২', badge: '২', subtitle: 'দুই', word: 'দুই', extra: 'দুইটি পাখি উড়ছে।', archetype: 'bird', accent: '#f59e0b', tone: '#22c55e', sound: 'দুই' },
        { title: '৩', badge: '৩', subtitle: 'তিন', word: 'তিন', extra: 'তিনটি চাকা ঘুরছে।', archetype: 'wheel', accent: '#8b5cf6', tone: '#f43f5e', sound: 'তিন' }
      ],
      sentences: [
        { title: 'কথা', badge: 'ক', subtitle: 'ছোট বাক্য', word: 'আমি খাই', extra: 'আমি খাই, আমি হাসি, আমি শিখি।', archetype: 'child', accent: '#ec4899', tone: '#f59e0b', sound: 'আমি খাই' },

      ],
      rhymes: [
        { title: 'ছড়া', badge: 'ছ', subtitle: 'ছড়া', word: 'চড়ুই', extra: 'চড়ুই পাখি, উড়ছে আকাশে।', archetype: 'bird', accent: '#f59e0b', tone: '#84cc16', sound: 'চড়ুই পাখি' },
        { title: 'গান', badge: 'গ', subtitle: 'গান', word: 'গান', extra: 'হাসি খেলে মজা হয়।', archetype: 'child', accent: '#8b5cf6', tone: '#ec4899', sound: 'হাসি খেলে মজা হয়' }

        { title: 'কুইজ', badge: '?', subtitle: 'খেলা', word: 'অজগর', extra: 'অজগর কি আসে? তেড়ে!', archetype: 'snake', accent: '#4f46e5', tone: '#10b981', sound: 'অজগর' }
      ]
    };

    const state = {
      activeTab: 'bangla',
      stars: 0,
      currentItem: null,
      customVoices: {}
    };

    function normalizeBanglaText(rawText) {
      if (!rawText) return '';
      return String(rawText)
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/([\u0980-\u09FF])\s*([\.,!?;:])/g, '$1$2')
        .replace(/([\.,!?;:])\s*([\u0980-\u09FF])/g, '$1 $2')
        .replace(/অজগর/gi, 'অজগর')
        .replace(/\s+\./g, '.');
    }

    function pickBanglaVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      if (!voices.length) return null;
      const preferred = voices.find(v => /bn|bangla|bengali/i.test(v.lang) && v.localService) ||
        voices.find(v => /bn|bangla|bengali/i.test(v.lang)) ||
        voices.find(v => /^en/i.test(v.lang));
      return preferred || voices[0];
    }

    function speakBangla(text) {
      if (!('speechSynthesis' in window)) {
        alert('আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই।');
        return;
      }
      const cleanText = normalizeBanglaText(text || '');
      if (!cleanText) return;

      const utterance = new SpeechSynthesisUtterance(cleanText);
      const voice = pickBanglaVoice();
      if (voice) {
        utterance.voice = voice;
      }
      utterance.lang = 'bn-BD';
      utterance.rate = 0.9;
      utterance.pitch = 1.12;
      utterance.volume = 1;
      utterance.onstart = () => {
        const wave = document.getElementById('modal-voice-wave');
        if (wave) wave.classList.remove('opacity-0');
        if (wave) wave.classList.add('opacity-100');
      };
      utterance.onend = () => {
        const wave = document.getElementById('modal-voice-wave');
        if (wave) wave.classList.remove('opacity-100');
        if (wave) wave.classList.add('opacity-0');
      };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function triggerCelebration() {
      const layer = document.getElementById('celebration-layer');
      if (!layer) return;
      state.stars += 1;
      document.getElementById('star-count').textContent = state.stars;

      const colors = ['#fbbf24', '#f472b6', '#22c55e', '#60a5fa', '#f97316', '#a78bfa'];
      for (let i = 0; i < 18; i++) {
        const dot = document.createElement('div');
        dot.className = 'celebration-spark';
        dot.style.left = `${Math.random() * 100}%`;
        dot.style.top = `${Math.random() * 100}%`;
        dot.style.background = colors[Math.floor(Math.random() * colors.length)];
        dot.style.width = `${8 + Math.random() * 12}px`;
        dot.style.height = dot.style.width;
        layer.appendChild(dot);
        setTimeout(() => dot.remove(), 900);
      }
    }

    function clearAllCustomVoices() {
      state.customVoices = {};
      document.getElementById('parent-banner').classList.add('hidden');
      document.getElementById('parent-mode-btn').classList.remove('bg-rose-500', 'text-white');
      document.getElementById('parent-mode-btn').classList.add('bg-slate-100', 'text-slate-700');
    }

    function toggleParentMode() {
      const banner = document.getElementById('parent-banner');
      const btn = document.getElementById('parent-mode-btn');
      const isHidden = banner.classList.contains('hidden');
      banner.classList.toggle('hidden', !isHidden);
      btn.classList.toggle('bg-rose-500', isHidden);
      btn.classList.toggle('text-white', isHidden);
      btn.classList.toggle('bg-slate-100', !isHidden);
      btn.classList.toggle('text-slate-700', !isHidden);
    }

    function createCardMarkup(item) {
      return `
        <div class="premium-card p-3 sm:p-4" data-key="${item.title || item.word}" onclick="openModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
          <div class="diorama-stage px-2 py-2 mb-3">
            ${renderSceneSVG(item)}
          </div>
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="bg-indigo-600 text-white px-3 py-1 rounded-xl text-2xl font-extrabold shadow-sm border-2 border-indigo-200">${item.badge}</span>
            <button class="toy-btn px-3 py-1.5 rounded-xl bg-emerald-500 text-white text-xs font-bold" onclick="event.stopPropagation(); speakBangla('${(item.sound || item.title).replace(/'/g, "\\'")}');">🔊 রেকর্ড</button>
          </div>
          <div class="text-left">
            <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-900 leading-tight">${item.title}</h3>
            <p class="text-sm sm:text-base font-bold text-rose-600">${item.subtitle}</p>
            <p class="mt-2 text-sm sm:text-base font-bold text-indigo-900">${item.word}</p>
          </div>
        </div>
      `;
    }

    function renderCards() {
      const container = document.getElementById('content-area');
      if (!container) return;
      const items = data[state.activeTab] || data.bangla;
      const grid = items.map(createCardMarkup).join('');
      container.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
          ${grid}
        </div>
      `;
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.nav-tab').forEach(btn => {
        const active = btn.id === `tab-${tab}`;
        btn.classList.toggle('scale-105', active);
        btn.classList.toggle('ring-2', active);
        btn.classList.toggle('ring-offset-2', active);
        btn.classList.toggle('ring-white', active);
      });
      renderCards();
    }

    function openModal(item) {
      state.currentItem = item;
      const modal = document.getElementById('card-modal');
      if (!modal) return;

      document.getElementById('modal-badge').textContent = item.badge || item.title;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-subtitle').textContent = item.subtitle || item.word;
      document.getElementById('modal-extra').textContent = item.extra || item.word;
      document.getElementById('modal-game-prompt').textContent = `${item.title} সম্পর্কে গল্পটি খেলা-ধরনের ভিজুয়াল…`;
      document.getElementById('modal-visual').innerHTML = renderSceneSVG(item);

      const actionBtn = document.getElementById('modal-action-btn');
      actionBtn.onclick = () => {
        triggerCelebration();
        const current = item;
        document.getElementById('modal-action-feedback').textContent = `${current.title} দেখো! ${current.word} খেলার মেজাজে আসছে!`;
        document.getElementById('modal-visual').querySelector('svg').style.transform = 'scale(1.05)';
        setTimeout(() => document.getElementById('modal-visual').querySelector('svg').style.transform = '', 500);
      };

      document.getElementById('modal-replay-btn').onclick = () => {
        speakBangla(item.sound || item.word || item.title);
      };

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      speakBangla(item.sound || item.word || item.title);
    }

    function closeModal(event) {
      const modal = document.getElementById('card-modal');
      if (event && event.target !== modal && !event.target.closest('#modal-box')) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function renderSubControls() {
      const sub = document.getElementById('sub-controls');
      sub.innerHTML = `
        <div class="glass-panel rounded-2xl px-3 py-2 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2 text-sm sm:text-base font-extrabold text-indigo-900">
            <span>🎯 মূল্যায়ন:</span>
            <span class="bg-amber-100 text-amber-900 rounded-full px-2 py-1">শব্দ</span>
            <span class="bg-emerald-100 text-emerald-900 rounded-full px-2 py-1">ভিজুয়াল</span>
            <span class="bg-pink-100 text-pink-900 rounded-full px-2 py-1">অভিজ্ঞতা</span>
          </div>
          <button onclick="testPureBanglaVoice()" class="toy-btn px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-xs sm:text-sm font-extrabold">পুরো বাংলায় পরীক্ষা</button>
        </div>
      `;
    }

    function testPureBanglaVoice() {
      speakBangla('অ অজগর আসছে তেড়ে। অ-র মুখে হাসি, অ-র দেহে লেজ, অ-র ভিজ্যুয়াল খুব সুন্দর।');
    }

    window.addEventListener('load', () => {
      renderSubControls();
      renderCards();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => pickBanglaVoice();
      }
      document.getElementById('star-count').textContent = String(state.stars);
    });
  </script>
</body>
